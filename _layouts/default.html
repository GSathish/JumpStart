<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E1116'/%3E%3Ccircle cx='11' cy='16' r='5' fill='%23E5372B'/%3E%3Ccircle cx='22' cy='16' r='5' fill='%231B4FD8'/%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="{{ '/' | relative_url }}">Jumpstart <span>2026</span></a>
      {% if page.sections %}
      <nav aria-label="Sections">
        {% for s in page.sections %}<a href="#{{ s.id }}">{{ s.label }}</a>{% endfor %}
      </nav>
      {% endif %}
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="inner">
      <span>{{ site.title }} &middot; {{ site.affiliation }}</span>
      {% if site.contact != "" %}<span>{{ site.contact }}</span>{% endif %}
      <span class="right">Updated {{ site.time | date: "%-d %B %Y" }}</span>
    </div>
  </footer>
</body>
</html>
